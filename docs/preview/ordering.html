<!doctype html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ordini online — componenti</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="../../public/assets/css/ordering.css" rel="stylesheet">
<style>
    body { margin: 0; padding: 16px; }
    .lbl { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; color: #adb5bd; margin: 20px 0 8px; }
    .lbl:first-child { margin-top: 0; }
    .wrap { max-width: 460px; margin: 0 auto; }
</style>
</head>
<body>
<div class="wrap">

    <div class="lbl">Intestazione del negozio</div>
    <div class="os-header">
        <div class="os-header-inner">
            <div class="os-header-logo"><span class="os-header-initials">TM</span></div>
            <div class="os-header-text">
                <div class="os-header-name">Trattoria Da Mario</div>
                <div class="os-header-sub">Asporto e consegna · 25–35 min</div>
            </div>
        </div>
    </div>

    <div class="lbl">Categorie</div>
    <div class="os-categories">
        <a href="#" class="os-cat-pill active">Tutti</a>
        <a href="#" class="os-cat-pill">Antipasti</a>
        <a href="#" class="os-cat-pill">Primi</a>
        <a href="#" class="os-cat-pill">Dolci</a>
    </div>

    <div class="lbl">Prodotto</div>
    <div class="os-item">
        <div class="os-item-content">
            <div class="os-item-name">Tagliatelle al ragù</div>
            <div class="os-item-desc">Sfoglia tirata a mano, ragù cotto otto ore.</div>
            <div class="os-item-bottom">
                <span class="os-item-price">12,00 €</span>
                <button type="button" class="os-add-btn"><i class="bi bi-plus"></i></button>
            </div>
        </div>
    </div>

    <div class="lbl">Carrello nel piede della pagina</div>
    <div class="os-cart-bar" style="position:static;">
        <div class="os-cart-bar-inner">
            <div class="os-cart-info">
                <span class="os-cart-count">3</span>
                <span class="os-cart-label">articoli · 31,00 €</span>
            </div>
            <button type="button" class="os-cart-btn">Vai all'ordine</button>
        </div>
    </div>

</div>
</body>
</html>
